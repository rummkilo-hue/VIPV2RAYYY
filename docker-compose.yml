version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vipv2ray-postgres
    restart: always
    environment:
      POSTGRES_DB: vipv2ray_db
      POSTGRES_USER: vipv2ray_user
      POSTGRES_PASSWORD: vipv2ray_secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: vipv2ray-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vipv2ray-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://vipv2ray_user:vipv2ray_secret_password@postgres:5432/vipv2ray_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_jwt_token_secret_vipv2ray
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: vipv2ray-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
